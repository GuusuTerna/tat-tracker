{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
    <h2 class="text-2xl font-bold mb-6">Create New Case</h2>
    
    <form method="POST">
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Patient Name *</label>
            <input type="text" name="patient_name" required class="w-full px-3 py-2 border rounded">
        </div>
        
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Department *</label>
            <select name="department" id="department" required onchange="updateTests()" class="w-full px-3 py-2 border rounded">
                <option value="Lab">Lab</option>
                <option value="Radiology">Radiology</option>
                <option value="Mobile">Mobile</option>
            </select>
        </div>
        
        <div class="mb-4">
            <label class="block text-gray-700 mb-2">Test Name *</label>
            <select name="test_name" id="test_name" required class="w-full px-3 py-2 border rounded">
                {% for test in lab_tests %}
                <option value="{{ test }}" class="lab-test">{{ test }}</option>
                {% endfor %}
                {% for test in radiology_tests %}
                <option value="{{ test }}" class="radiology-test" style="display:none">{{ test }}</option>
                {% endfor %}
                {% for test in mobile_tests %}
                <option value="{{ test }}" class="mobile-test" style="display:none">{{ test }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-4 text-sm text-gray-500">
            <i class="fas fa-info-circle"></i> SLA will be calculated based on the SLA configured for this test.
        </div>
        
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
            Create Case
        </button>
    </form>
</div>

<script>
function updateTests() {
    const dept = document.getElementById('department').value;
    document.querySelectorAll('.lab-test').forEach(el => el.style.display = dept === 'Lab' ? '' : 'none');
    document.querySelectorAll('.radiology-test').forEach(el => el.style.display = dept === 'Radiology' ? '' : 'none');
    document.querySelectorAll('.mobile-test').forEach(el => el.style.display = dept === 'Mobile' ? '' : 'none');
}
</script>
{% endblock %}
